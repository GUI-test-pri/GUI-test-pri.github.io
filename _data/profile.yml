  "short_bio": "<p>I am a researcher and software developer working on <strong>privacy, security, and reliable software</strong>. I will join McGill University as a PhD student in January 2027, supervised by Dr. Lili Wei.</p>\n<p>I received my Master of Computer Science from the University of New Brunswick, supervised by Dr. Rongxing Lu, and my Bachelor of Computer Science with a Minor in Mathematics from Dalhousie University.</p>\n<p>My work spans secure IoT communication, privacy-preserving data sharing and analytics, and machine learning for device identification and anomaly detection. I have contributed to research collaborations with the National Research Council Canada and Mastercard, developed industrial software at Trihedral, and co-founded CurioSeed, a learning-companion chatbot venture for children.</p>",
