{% assign item = include.item %}
<article class="publication-item" data-publication data-category="{{ item.category }}" data-year="{{ item.year }}">
  <div class="publication-venue" aria-hidden="true"><strong>{{ item.venue_short }}</strong><span>{{ item.category }}</span></div>
  <div class="publication-detail">
    <h3>{{ item.title }}</h3>
    <p class="publication-authors">{% include widgets/author_list.html authors=item.authors %}</p>
    <p class="publication-citation"><i>{{ item.pub }}</i>{{ item.pub_post }} {{ item.pub_date }}{% if item.note %} <span class="text-muted">{{ item.note }}</span>{% endif %}</p>
  </div>
</article>
