<div class="profile-sticky">
  <section class="card border-0 shadow-sm bg-white profile-card" aria-label="Profile">
    <div class="card-body p-4 text-center">
      <img src="{{ site.data.profile.portrait_url | relative_url }}" class="profile-portrait" alt="{{ site.data.profile.portrait_caption }}" width="240" height="240">
      <h1 class="profile-name">{{ site.data.profile.primary_name }}</h1>
      <p class="profile-role">Incoming PhD Student</p>
      <p class="profile-affiliation">McGill University<br><span class="text-muted">Starting January 2027</span></p>
      <p class="profile-location"><i class="fas fa-location-dot" aria-hidden="true"></i> {{ site.data.profile.location }}</p>
      <div class="profile-links">
        <a href="mailto:{{ site.data.profile.email }}"><i class="far fa-envelope" aria-hidden="true"></i> Email</a>
        <a href="https://github.com/{{ site.data.profile.github }}" target="_blank" rel="noopener noreferrer"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a>
        <a href="{{ site.data.profile.dblp }}" target="_blank" rel="noopener noreferrer"><i class="fas fa-book-open" aria-hidden="true"></i> DBLP</a>
        <a href="{{ site.data.profile.cv_link | relative_url }}" target="_blank" rel="noopener noreferrer"><i class="far fa-file-pdf" aria-hidden="true"></i> Curriculum Vitae</a>
      </div>
      <div class="profile-topics">Privacy · Security<br>Reliable Software</div>
    </div>
  </section>
</div>
